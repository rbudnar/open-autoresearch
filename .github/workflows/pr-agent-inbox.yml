name: PR Agent Inbox

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created]
  workflow_run:
    workflows:
      - check-drift
      - protect-protocol
      - validate-examples
      - validate-ledger
      - PR Agent Inbox Signal
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to refresh; omit for a bounded sweep.
        required: false

permissions: {}

jobs:
  resolve-targets:
    name: resolve targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      default-name: ${{ steps.resolve.outputs.default-name }}
      default-oid: ${{ steps.resolve.outputs.default-oid }}
      has-prs: ${{ steps.resolve.outputs.has-prs }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Admit event and resolve current PR identities
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.event.repository.full_name }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || '' }}
          PR_BASE: ${{ github.event.pull_request.base.ref || '' }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login || '' }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request && 'true' || 'false' }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id || '' }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name || '' }}
          WORKFLOW_PATH: ${{ github.event.workflow_run.path || '' }}
          WORKFLOW_REPOSITORY: ${{ github.event.workflow_run.repository.full_name || '' }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event || '' }}
          WORKFLOW_PRS: ${{ toJSON(github.event.workflow_run.pull_requests || fromJSON('[]')) }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          INPUT_PR: ${{ github.event.inputs.pr || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_REPOSITORY" != "$REPO" ]]; then
            echo "::error::Refusing an event whose repository does not match the workflow repository."
            exit 1
          fi

          route_default_name="$(gh api "repos/${REPO}" --jq '.default_branch')"
          route_default_oid="$(gh api "repos/${REPO}/commits/${route_default_name}" --jq '.sha')"
          if [[ -z "$route_default_name" || "$route_default_name" != "$EVENT_DEFAULT_BRANCH" ||
                ! "$route_default_oid" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::The current default branch did not resolve to an exact commit."
            exit 1
          fi

          prs=()
          refresh_only=false

          validate_pr_number() {
            local candidate="$1"
            if [[ ! "$candidate" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Malformed pull request identity: ${candidate}."
              exit 1
            fi
          }

          add_current_open_default_pr() {
            local candidate="$1"
            validate_pr_number "$candidate"
            local pr_json
            pr_json="$(gh pr view "$candidate" --repo "$REPO" --json number,state,baseRefName)"
            if [[ "$(jq -r '.state' <<< "$pr_json")" == "OPEN" &&
                  "$(jq -r '.baseRefName' <<< "$pr_json")" == "$route_default_name" ]]; then
              prs+=("$(jq -r '.number' <<< "$pr_json")")
            fi
          }

          case "$EVENT_NAME" in
            pull_request_target)
              validate_pr_number "$PR_NUMBER"
              if [[ "$PR_BASE" != "$route_default_name" ]]; then
                echo "::error::Refusing a pull request outside the current default branch."
                exit 1
              fi
              prs+=("$PR_NUMBER")
              ;;
            issue_comment)
              if [[ "$IS_PR_COMMENT" == "true" ]]; then
                command="$(node -e 'process.stdout.write(process.env.COMMENT_BODY.trim())')"
                if [[ "$command" == "/agent-inbox refresh" ]]; then
                  permission="$(gh api "repos/${REPO}/collaborators/${COMMENT_AUTHOR}/permission" --jq '.permission')"
                  case "$permission" in
                    admin|maintain|write) ;;
                    *)
                      echo "::error::${COMMENT_AUTHOR} is not authorized to refresh the Agent Inbox."
                      exit 1
                      ;;
                  esac
                  add_current_open_default_pr "$PR_NUMBER"
                fi
              fi
              ;;
            workflow_run)
              case "$WORKFLOW_NAME" in
                check-drift)
                  expected_path=".github/workflows/check-drift.yml"
                  expected_event="pull_request"
                  ;;
                protect-protocol)
                  expected_path=".github/workflows/protect-protocol.yml"
                  expected_event="pull_request"
                  ;;
                validate-examples)
                  expected_path=".github/workflows/validate-examples.yml"
                  expected_event="pull_request"
                  ;;
                validate-ledger)
                  expected_path=".github/workflows/validate-ledger.yml"
                  expected_event="pull_request"
                  ;;
                "PR Agent Inbox Signal")
                  expected_path=".github/workflows/pr-agent-inbox-signal.yml"
                  case "$WORKFLOW_EVENT" in
                    pull_request_review|pull_request_review_comment) expected_event="$WORKFLOW_EVENT" ;;
                    *)
                      echo "::error::Signal workflow_run has an inadmissible source event."
                      exit 1
                      ;;
                  esac
                  ;;
                *)
                  echo "::error::Unrecognized workflow_run producer."
                  exit 1
                  ;;
              esac

              if [[ "$WORKFLOW_REPOSITORY" != "$REPO" || ! "$WORKFLOW_ID" =~ ^[0-9]+$ ||
                    "$WORKFLOW_PATH" != "$expected_path" || "$WORKFLOW_EVENT" != "$expected_event" ]]; then
                echo "::error::workflow_run provenance did not match the canonical producer contract."
                exit 1
              fi

              current_workflow="$(gh api "repos/${REPO}/actions/workflows/${WORKFLOW_ID}")"
              if [[ "$(jq -r '.id' <<< "$current_workflow")" != "$WORKFLOW_ID" ||
                    "$(jq -r '.name' <<< "$current_workflow")" != "$WORKFLOW_NAME" ||
                    "$(jq -r '.path' <<< "$current_workflow")" != "$expected_path" ||
                    "$(jq -r '.state' <<< "$current_workflow")" != "active" ]]; then
                echo "::error::workflow_run producer is not the current canonical workflow identity."
                exit 1
              fi

              if [[ "$(jq 'length' <<< "$WORKFLOW_PRS")" -gt 0 ]]; then
                candidates="$(jq -er '.[] | if (.number | type) == "number" and (.number | floor) == .number and .number > 0 then .number else error("invalid PR") end' <<< "$WORKFLOW_PRS")"
                while IFS= read -r candidate; do
                  add_current_open_default_pr "$candidate"
                done <<< "$candidates"
              else
                if [[ ! "$WORKFLOW_HEAD_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
                  echo "::error::Invalid workflow_run head_sha; expected an exact 40-hex commit."
                  exit 1
                fi
                associated="$(gh api -H "Accept: application/vnd.github+json" \
                  "repos/${REPO}/commits/${WORKFLOW_HEAD_SHA}/pulls" --paginate --jq '.[].number')"
                while IFS= read -r candidate; do
                  [[ -z "$candidate" ]] || add_current_open_default_pr "$candidate"
                done <<< "$associated"
              fi
              ;;
            workflow_dispatch)
              if [[ "$REF_NAME" != "$route_default_name" ]]; then
                echo "::error::Manual recovery must run from the current default branch."
                exit 1
              fi
              if [[ -n "$INPUT_PR" ]]; then
                add_current_open_default_pr "$INPUT_PR"
              else
                refresh_only=true
                open_prs="$(gh pr list --repo "$REPO" --state open --base "$route_default_name" --limit 101 \
                  --json number,isDraft --jq '.[].number')"
                while IFS= read -r candidate; do
                  [[ -z "$candidate" ]] || prs+=("$candidate")
                done <<< "$open_prs"
                if (( ${#prs[@]} > 100 )); then
                  echo "::error::Manual recovery found more than 100 PRs; refusing a partial sweep."
                  exit 1
                fi
              fi
              ;;
            *)
              echo "::error::Unsupported Agent Inbox event: ${EVENT_NAME}."
              exit 1
              ;;
          esac

          matrix="$(printf '%s\n' "${prs[@]}" | jq -Rsc \
            --argjson refresh "$refresh_only" \
            'split("\n") | map(select(length > 0) | tonumber) | unique | {include: map({pr: ., refresh: $refresh})}')"
          count="$(jq '.include | length' <<< "$matrix")"
          {
            echo "default-name=$route_default_name"
            echo "default-oid=$route_default_oid"
            echo "has-prs=$([[ "$count" -gt 0 ]] && echo true || echo false)"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: agent-inbox
    needs: resolve-targets
    if: needs.resolve-targets.outputs.has-prs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    concurrency:
      group: pr-agent-inbox-pr-${{ matrix.pr }}
      cancel-in-progress: false
    steps:
      - name: Re-read current PR and default-branch state after concurrency admission
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROUTE_DEFAULT_NAME: ${{ needs.resolve-targets.outputs.default-name }}
          ROUTE_DEFAULT_OID: ${{ needs.resolve-targets.outputs.default-oid }}
          TARGET_PR: ${{ matrix.pr }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_PR" =~ ^[1-9][0-9]*$ ]] ||
             [[ ! "$ROUTE_DEFAULT_OID" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Invalid publisher identity or route-time default OID."
            exit 1
          fi

          current_default_name="$(gh api "repos/${REPO}" --jq '.default_branch')"
          current_default_oid="$(gh api "repos/${REPO}/commits/${current_default_name}" --jq '.sha')"
          if [[ "$current_default_name" != "$ROUTE_DEFAULT_NAME" ||
                "$current_default_oid" != "$ROUTE_DEFAULT_OID" ]]; then
            echo "::error::Default branch name or OID changed after routing; retry from current state."
            exit 1
          fi

          scope_tsv="$(gh pr view "$TARGET_PR" --repo "$REPO" \
            --json state,baseRefName,headRefOid,isDraft,isCrossRepository \
            --jq '[.state, .baseRefName, .headRefOid, .isDraft, .isCrossRepository] | @tsv')"
          IFS=$'\t' read -r state baseRefName headRefOid isDraft isCrossRepository <<< "$scope_tsv"
          if [[ "$baseRefName" != "$current_default_name" ]]; then
            echo "::error::Refusing to publish for a PR outside the current default branch."
            exit 1
          fi

          {
            echo "default-oid=$current_default_oid"
            echo "state=$state"
            echo "head=$headRefOid"
            echo "draft=$isDraft"
            echo "cross-repository=$isCrossRepository"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.scope.outputs.default-oid }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recompute and publish the Agent Inbox
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: ${{ matrix.pr }}
          REFRESH_ONLY: ${{ matrix.refresh }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --repo "$GITHUB_REPOSITORY"
            --pr "$TARGET_PR"
            --assert-no-agent-attention
            --update-comment
            --ensure-label
            --sync-label
            --publish-status
            --ignore-check "agent-inbox-clean"
            --ignore-check "PR Agent Inbox / agent-inbox"
            --ignore-check "PR Agent Inbox Signal / Agent inbox"
          )
          if [[ "$REFRESH_ONLY" == "true" ]]; then
            args+=(--refresh)
          fi
          node scripts/pr-agent-inbox.mjs "${args[@]}"
